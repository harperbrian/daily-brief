name: Daily Brief

on:
  # Primary trigger: the Cloudflare Worker in cloudflare/trigger dispatches this
  # at 3 AM local with scheduled=true, which starts within seconds. GitHub's
  # own cron started the 7 AM brief a median ~5.5 h late (2026-09-30 to 10-07),
  # so it is kept only as a BACKUP in case the Worker or its token fails. The
  # guard below runs the first trigger of the day at/after 3 AM and skips the
  # rest by date, so the backups cost a minute each when the Worker worked.
  schedule:
    # Backups to the on-time Cloudflare trigger (cloudflare/trigger), which
    # dispatches this at 3 AM local. 09:07 and 12:07 UTC fall between 3 and 8 AM
    # in the US time zones. The guard below lets the first run at or after 3 AM
    # local proceed and dedupes the other by date, so drift delays the brief
    # rather than losing it.
    - cron: '7 9 * * *'
    - cron: '7 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the brief but do not email or record history'
        type: boolean
        default: false
      scheduled:
        description: 'Set by the on-time trigger: apply the once-a-day checks like a cron run'
        type: boolean
        default: false

# Shared with the breaking-alert workflow: both write state/history.json, and
# two concurrent writers would lose one of the updates.
concurrency:
  group: brief-state
  cancel-in-progress: false
  # Without this GitHub keeps ONE pending run per group and a newly queued run
  # cancels it: on 2026-09-30 an alert cancelled a waiting brief, and on 10-05 a
  # brief cancelled a waiting alert. With hourly dispatches that would be common.
  # `max` lets runs wait in line instead (FIFO, up to 100).
  queue: max

jobs:
  brief:
    # Real sends only from main. The on-time trigger's token can dispatch any
    # existing branch; this keeps a branch from ever emailing (dry runs are
    # still allowed anywhere, for testing).
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    # Pinned: ubuntu-latest moves to 26.04 from 2026-10-19, whose coreutils may
    # not be GNU, and the guard below relies on GNU `date -d @N`.
    runs-on: ubuntu-24.04
    env:
      # Your IANA timezone. Keep it equal to `timezone` in config/preferences.json.
      LOCAL_TZ: America/Chicago
    # 55 min. Measured Claude-subscription runs: 23.8 min on 2026-08-23 (233
    # candidates, from a Mac), 27.0 and 31.3 min on 2026-09-18 (257 and 260
    # candidates, ubuntu-latest) -- the claude-code provider runs one CLI call
    # at a time by design (concurrency=1), since subscription rate limits are
    # per-account rather than per-request. 15 min killed the job mid-scoring
    # before it ever sent; 40 left under 9 min of headroom on the first live
    # run. 55 covers a heavy news day and is still well under GitHub's
    # 360-minute hosted-runner ceiling. Unused minutes cost nothing.
    timeout-minutes: 55
    permissions:
      contents: write # only to commit the history file back
      actions: read   # the guard counts today's failed runs

    steps:
      - uses: actions/checkout@v6
        with:
          # Check out the branch tip when the job STARTS, not the commit that was
          # current when GitHub queued the event. On 2026-09-22 the second DST
          # cron was queued at 15:33 UTC, waited behind the first run in the
          # concurrency group, and started 20 s after that run pushed today's
          # history. Pinned to the stale SHA, its guard saw no brief for today,
          # sent a second one, then failed on a history.json rebase conflict.
          ref: ${{ github.ref }}

      - name: Should today's brief run now?
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as env, never spliced into the script: a dispatch input is
          # caller-supplied text.
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULED_INPUT: ${{ inputs.scheduled }}
        run: |
          HOUR=$(TZ=$LOCAL_TZ date +%H)
          TODAY=$(TZ=$LOCAL_TZ date +%Y-%m-%d)
          # local date of the most recent brief actually sent. Alerts never
          # touch `entries`, and dry runs never write history, so this is a
          # clean "already sent today" signal.
          LAST_MS=$(jq -r '[.entries[]?.sent_at] | max // 0' state/history.json)
          LAST_DAY=$(TZ=$LOCAL_TZ date -d "@$((LAST_MS / 1000))" +%Y-%m-%d)
          echo "local hour: $HOUR  today: $TODAY  last brief: $LAST_DAY"
          # Manual runs always proceed. Scheduled runs proceed once per day, at
          # or after 3 AM. The old guard required the hour to be exactly 06,
          # and GitHub cron drift on 2026-09-18 was ~4 hours (the 10:30 UTC
          # cron fired at 14:35), so BOTH daily crons were rejected and no
          # brief would have gone out. Date-dedupe instead of hour-match means
          # drift of any size delays the brief rather than losing it, and the
          # second DST cron entry is a no-op because the first already sent.
          # Runs that failed AFTER scoring today (>10 min). Several triggers a
          # day otherwise repeat a ~25 min failure five times: 2026-09-30 billed 92
          # minutes and sent a failure email per attempt. One retry is allowed.
          # Any error here counts as zero failures, so it can never block a send.
          # Every trigger counts (cron backups and on-time dispatches alike).
          LONG_FAILS=$( (gh run list --workflow daily-brief.yml --status failure --limit 20 \
              --json startedAt,updatedAt --jq '.[] | "\(.startedAt) \(.updatedAt)"' 2>/dev/null || true) |
            while read -r S U; do
              # if/fi, not `[ ] && echo`: the step runs with -eo pipefail, and a
              # loop ending on a false test would fail the guard.
              if [ "$(TZ=$LOCAL_TZ date -d "$S" +%Y-%m-%d)" = "$TODAY" ] &&
                 [ $(( $(date -d "$U" +%s) - $(date -d "$S" +%s) )) -gt 600 ]; then echo x; fi
            done | wc -l)
          echo "long failed runs today: $LONG_FAILS"
          # A manual run always proceeds. A dispatch from the on-time trigger
          # (scheduled=true) gets the same once-a-day checks as a cron run.
          MANUAL=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SCHEDULED_INPUT" != "true" ]; then MANUAL=true; fi
          if [ "$MANUAL" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$LAST_DAY" = "$TODAY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: today's brief already sent."
          elif [ "$LONG_FAILS" -ge 2 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: two runs already failed after scoring today; not burning a third."
          elif [ "$((10#$HOUR))" -ge 3 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: before 3 AM local."
          fi

      - uses: actions/setup-node@v6
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: Install
        if: steps.guard.outputs.run == 'true'
        run: npm ci

      # Only needed in subscription mode. The install runs WITHOUT the token in its
      # environment: the package has a postinstall script, and nothing at install
      # time needs the credential. HAS_TOKEN is a boolean, never the value.
      - name: Install Claude Code CLI (subscription mode only)
        if: steps.guard.outputs.run == 'true'
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code
            echo "claude $(claude --version)"
          else
            echo "Not in subscription mode; skipping."
          fi

      - name: Claude token smoke test
        if: steps.guard.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "Not in subscription mode; skipping."; exit 0; fi
          # One tiny call so the log says plainly whether the token authenticates
          # on this runner. Never fails the job: the pipeline cascades to the next
          # provider on its own, this just makes the reason readable.
          set +e
          OUT=$(claude -p 'Reply with the single word OK' --output-format json --model haiku </dev/null 2>/tmp/claude-smoke.err)
          RC=$?
          set -e
          echo "smoke exit=$RC"
          echo "smoke stdout: $(echo "$OUT" | head -c 400)"
          echo "smoke stderr: $(grep -v 'no stdin data' /tmp/claude-smoke.err | head -c 800)"
          # The pipeline asks for the aliases "haiku" (scoring) and "sonnet"
          # (writing); the CLI decides which model version each one means.
          # Print the resolved IDs so the log says what actually ran.
          for M in haiku sonnet; do
            R=$(claude -p 'Reply with the single word OK' --output-format json --model "$M" </dev/null 2>/dev/null || true)
            echo "alias $M -> $(echo "$R" | jq -r '(.modelUsage // {}) | keys | join(", ")' 2>/dev/null)"
          done

      - name: Generate and send
        if: steps.guard.outputs.run == 'true'
        env:
          # Provider is auto-detected from whichever credential exists, free
          # options first: claude-code → gemini → rule-based (the metered
          # anthropic provider is deliberately not wired into CI).
          # Set the MODEL_PROVIDER repo variable to force one explicitly.
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # No ANTHROPIC_API_KEY on purpose: that provider is metered. The brief
          # runs on the Claude subscription and Gemini's free tier only.
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_TO: ${{ secrets.BRIEF_TO }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }} # optional; RSS-only if unset
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "dry_run input: '$DRY_RUN_INPUT' (event: $EVENT_NAME)"
          npm run brief ${{ inputs.dry_run && '-- --dry-run' || '' }}

      - name: Commit history
        if: steps.guard.outputs.run == 'true' && !inputs.dry_run
        run: |
          git config user.name  "daily-brief-bot"
          git config user.email "actions@github.com"
          # usage.json holds the real per-run token counts (npm run usage).
          # Before 2026-09-22 only history.json was added, so every measured
          # run was discarded with the runner and the report showed a projection.
          git add state/history.json
          # Absent until the first send that used a model; a pathspec error here
          # would fail the step after the email went out.
          [ -f state/usage.json ] && git add state/usage.json
          if git diff --staged --quiet; then
            echo "No history change."
          else
            git commit -m "history: $(TZ=$LOCAL_TZ date +%Y-%m-%d)"
            # Rebase first: if anything was pushed since checkout, a bare push
            # would fail and today's history would be lost.
            git pull --rebase --autostash
            git push
          fi

      # Kept only when it is needed: a failed send (so the morning's brief can
      # still be read from the Actions page) or a dry run (to inspect). Anyone
      # holding a token with Actions read can download artifacts, so a
      # successful brief, already in your inbox, is not kept here.
      - name: Upload brief
        if: always() && steps.guard.outputs.run == 'true' && (failure() || inputs.dry_run)
        uses: actions/upload-artifact@v6
        with:
          name: brief-${{ github.run_number }}
          path: out/
          retention-days: 7
          if-no-files-found: warn
